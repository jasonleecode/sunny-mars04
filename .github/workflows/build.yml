name: build
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config libusb-1.0-0-dev libpng-dev libsdl2-dev libcairo2-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DMARS04_BUILD_GUI=ON -DMARS04_SANITIZERS=${{ matrix.mode == 'Debug' && 'ON' || 'OFF' }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/mars04-capture --help
      - run: ./build/mars04-viewer --help
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake pkgconf libusb sdl2 cairo libpng
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMARS04_BUILD_GUI=ON
      - run: cmake --build build --parallel 3
      - run: ctest --test-dir build --output-on-failure
      - run: ./build/mars04-capture --help
      - run: ./build/mars04-viewer.app/Contents/MacOS/mars04-viewer --help
